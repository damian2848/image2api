# Production override for an HTTPS reverse proxy on the host.
# Set IMAGE_PUBLIC_ORIGIN to the exact public origin, for example
# https://image.example.com. The application itself remains private on :2000.
services:
  backend:
    environment:
      CORS_ORIGINS: ${IMAGE_PUBLIC_ORIGIN:?IMAGE_PUBLIC_ORIGIN must be set to the public HTTPS origin}
      COOKIE_SECURE: "true"
